<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百人一首 読み上げ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d2137;
    --bg2: #122840;
    --bg3: #1a3a55;
    --accent: #c8a96e;
    --accent2: #e8c98e;
    --text: #f0e8d8;
    --text2: #c0b090;
    --border: #2a4a6a;
    --kami-bg: #1a3a20;
    --shimo-bg: #3a1a1a;
    --radius: 12px;
  }

  body {
    font-family: 'Noto Serif JP', '游明朝', 'Yu Mincho', 'HGS明朝E', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }
  header h1 {
    font-size: 1.6rem;
    color: var(--accent2);
    letter-spacing: 0.15em;
  }
  header p {
    font-size: 0.8rem;
    color: var(--text2);
    margin-top: 4px;
    letter-spacing: 0.08em;
  }

  /* ===== SCREEN VISIBILITY ===== */
  .screen { display: none; flex: 1; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== SELECTION SCREEN ===== */
  #sel-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .btn-sm {
    padding: 6px 14px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: transparent;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-sm:hover, .btn-sm:active { background: rgba(200,169,110,0.15); }

  #sel-count {
    margin-left: auto;
    font-size: 0.9rem;
    color: var(--accent2);
    white-space: nowrap;
  }

  #poem-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 80px;
  }
  .poem-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;
    border-radius: 6px;
    margin-bottom: 2px;
  }
  .poem-item:hover { background: var(--bg3); }
  .poem-item input[type=checkbox] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    flex-shrink: 0;
    cursor: pointer;
  }
  .poem-item .num {
    font-size: 0.75rem;
    color: var(--text2);
    width: 24px;
    text-align: right;
    flex-shrink: 0;
  }
  .poem-item .info { flex: 1; min-width: 0; }
  .poem-item .author {
    font-size: 0.75rem;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .poem-item .kami-preview {
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .poem-item .shimo-preview {
    font-size: 0.85rem;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  #sel-footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
  }

  /* ===== READ SCREEN ===== */
  #read-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  #remaining {
    font-size: 1rem;
    color: var(--accent2);
    letter-spacing: 0.06em;
  }
  #progress-bar-wrap {
    height: 4px;
    background: var(--border);
  }
  #progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s;
    width: 0%;
  }

  #poem-display {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px 20px;
    gap: 20px;
  }

  #author-display {
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: 0.12em;
  }

  .verse-box {
    width: 100%;
    max-width: 500px;
    border-radius: var(--radius);
    padding: 20px 24px;
    text-align: center;
    line-height: 1.9;
  }
  #kami-box {
    background: var(--kami-bg);
    border: 1px solid #2a5a30;
  }
  #shimo-box {
    background: var(--shimo-bg);
    border: 1px solid #5a2a2a;
    transition: opacity 0.3s;
  }
  #shimo-box.hidden { opacity: 0; pointer-events: none; }

  .verse-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    opacity: 0.7;
  }
  #kami-box .verse-label { color: #8acea0; }
  #shimo-box .verse-label { color: #ce8a8a; }

  .verse-text {
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: var(--text);
  }
  @media (max-width: 400px) { .verse-text { font-size: 1.2rem; } }

  #phase-indicator {
    font-size: 0.85rem;
    color: var(--text2);
    letter-spacing: 0.1em;
    min-height: 1.4em;
  }

  #shimo-countdown {
    width: 100%;
    max-width: 500px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s;
  }
  #shimo-countdown.active { opacity: 1; }
  #shimo-countdown-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 1.5s linear;
  }

  #read-footer {
    padding: 16px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  /* ===== BUTTONS ===== */
  .btn-primary {
    padding: 14px 32px;
    background: var(--accent);
    color: #1a1000;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: background 0.15s, opacity 0.15s;
  }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary:not(:disabled):hover { background: var(--accent2); }

  .btn-secondary {
    padding: 14px 24px;
    background: transparent;
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: var(--bg3); }

  /* ===== DONE SCREEN ===== */
  #done-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 24px;
    padding: 40px 20px;
    text-align: center;
  }
  #done-screen h2 { font-size: 1.8rem; color: var(--accent2); letter-spacing: 0.15em; }
  #done-screen p { color: var(--text2); line-height: 1.8; }

  /* ===== SPEED CONTROL ===== */
  #speed-control {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    padding: 6px 16px 10px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  #speed-control label {
    font-size: 0.78rem;
    color: var(--text2);
    white-space: nowrap;
  }
  #speed-slider {
    -webkit-appearance: none;
    width: 120px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  #speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  #speed-value {
    font-size: 0.78rem;
    color: var(--accent2);
    width: 2.8em;
  }

  /* ===== SEARCH ===== */
  #search-box {
    flex: 1;
    min-width: 120px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg3);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
  }
  #search-box:focus { border-color: var(--accent); }
  #search-box::placeholder { color: var(--text2); opacity: 0.7; }
</style>
</head>
<body>

<header>
  <h1>百人一首</h1>
  <p>読み上げアプリ</p>
</header>

<div id="speed-control">
  <label for="speed-slider">速度</label>
  <input type="range" id="speed-slider" min="60" max="100" value="95"
         step="5" oninput="setSpeed(this.value)">
  <span id="speed-value">0.95</span>
</div>

<!-- ===== SELECTION SCREEN ===== -->
<div id="screen-sel" class="screen active">
  <div id="sel-controls">
    <button class="btn-sm" onclick="selectAll()">全選択</button>
    <button class="btn-sm" onclick="selectNone()">全解除</button>
    <input type="text" id="search-box" placeholder="作者・歌で検索…" oninput="filterList()">
    <button class="btn-sm" id="search-clear" onclick="clearSearch()" style="display:none;">✕</button>
    <span id="sel-count">0首選択中</span>
  </div>
  <div id="poem-list"></div>
  <div id="sel-footer">
    <button class="btn-primary" id="start-btn" disabled onclick="startReading()">読み上げ開始</button>
  </div>
</div>

<!-- ===== READ SCREEN ===== -->
<div id="screen-read" class="screen">
  <div id="read-header">
    <span id="remaining">残り 0 / 0</span>
    <button class="btn-secondary" style="padding:8px 14px;font-size:0.85rem;" onclick="backToSel()">選択に戻る</button>
  </div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="poem-display">
    <div id="author-display"></div>
    <div class="verse-box" id="kami-box">
      <div class="verse-label">上の句</div>
      <div class="verse-text" id="kami-text"></div>
    </div>
    <div id="phase-indicator"></div>
    <div id="shimo-countdown"><div id="shimo-countdown-bar"></div></div>
    <div class="verse-box" id="shimo-box">
      <div class="verse-label">下の句</div>
      <div class="verse-text" id="shimo-text"></div>
    </div>
  </div>
  <div id="read-footer">
    <button class="btn-primary" id="next-btn" onclick="nextPoem()">次へ</button>
  </div>
</div>

<!-- ===== DONE SCREEN ===== -->
<div id="screen-done" class="screen">
  <div id="done-screen">
    <h2>完了</h2>
    <p id="done-msg"></p>
    <button class="btn-primary" onclick="backToSel()">選択に戻る</button>
  </div>
</div>

// ===== STATE =====
let queue = [];
let currentIdx = 0;
let totalSelected = 0;
let readingRate = 0.95;
let currentAudio = null;

// ===== AUDIO =====
function stopAll() {
  if (currentAudio) {
    currentAudio.onended = null;
    currentAudio.onerror = null;
    currentAudio.pause();
    currentAudio = null;
  }
}

function playPoem(poem) {
  stopAll();
  const src = `audio/${String(poem.id).padStart(3,'0')}_combined.mp3`;
  currentAudio = new Audio(src);
  currentAudio.playbackRate = readingRate;
  currentAudio.onended = () => {
    currentAudio = null;
    document.getElementById('phase-indicator').textContent = '';
    nextPoem();
  };
  currentAudio.onerror = () => {
    currentAudio = null;
    nextPoem();
  };
  const p = currentAudio.play();
  if (p) p.catch(() => {});
}

function setSpeed(val) {
  readingRate = parseInt(val) / 100;
  document.getElementById('speed-value').textContent = readingRate.toFixed(2);
  if (currentAudio) currentAudio.playbackRate = readingRate;
}

// ===== BUILD LIST =====
function buildList() {
  const el = document.getElementById('poem-list');
  el.innerHTML = '';
  POEMS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'poem-item';
    div.innerHTML = `
      <input type="checkbox" id="chk${p.id}" onchange="updateCount()" checked>
      <span class="num">${p.id}</span>
      <label class="info" for="chk${p.id}" style="cursor:pointer;">
        <div class="author">${p.author}</div>
        <div class="kami-preview">${p.kami}</div>
        <div class="shimo-preview">${p.shimo}</div>
      </label>`;
    el.appendChild(div);
  });
  updateCount();
}

function updateCount() {
  const checked = document.querySelectorAll('#poem-list input:checked').length;
  document.getElementById('sel-count').textContent = `${checked}首選択中`;
  document.getElementById('start-btn').disabled = checked === 0;
  saveSelection();
}

function selectAll() {
  document.querySelectorAll('.poem-item').forEach(item => {
    if (item.style.display !== 'none') item.querySelector('input').checked = true;
  });
  updateCount();
}
function selectNone() {
  document.querySelectorAll('.poem-item').forEach(item => {
    if (item.style.display !== 'none') item.querySelector('input').checked = false;
  });
  updateCount();
}

// ===== SEARCH =====
function filterList() {
  const q = document.getElementById('search-box').value.trim();
  document.getElementById('search-clear').style.display = q ? '' : 'none';
  document.querySelectorAll('.poem-item').forEach(item => {
    if (!q) { item.style.display = ''; return; }
    const id = parseInt(item.querySelector('input').id.replace('chk', ''));
    const p = POEMS.find(p => p.id === id);
    const hit = p.author.includes(q) || p.kami.includes(q) || p.shimo.includes(q);
    item.style.display = hit ? '' : 'none';
  });
}

function clearSearch() {
  document.getElementById('search-box').value = '';
  filterList();
}

// ===== SELECTION PERSISTENCE =====
const SEL_KEY = 'hyakunin-selection';

function saveSelection() {
  const ids = [...document.querySelectorAll('#poem-list input:checked')]
    .map(c => parseInt(c.id.replace('chk', '')));
  localStorage.setItem(SEL_KEY, JSON.stringify(ids));
}

function loadSelection() {
  const saved = localStorage.getItem(SEL_KEY);
  if (!saved) return;
  const ids = new Set(JSON.parse(saved));
  document.querySelectorAll('#poem-list input').forEach(c => {
    c.checked = ids.has(parseInt(c.id.replace('chk', '')));
  });
}

// ===== SCREEN SWITCH =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function backToSel() {
  stopAll();
  showScreen('screen-sel');
}

// ===== START READING =====
function startReading() {
  const checked = [...document.querySelectorAll('#poem-list input:checked')];
  const ids = new Set(checked.map(c => parseInt(c.id.replace('chk',''))));
  queue = POEMS.filter(p => ids.has(p.id));
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  currentIdx = 0;
  totalSelected = queue.length;
  showScreen('screen-read');
  loadPoem(0);
}

// ===== LOAD POEM =====
function loadPoem(idx) {
  if (idx >= queue.length) {
    showDone();
    return;
  }
  stopAll();

  const poem = queue[idx];
  document.getElementById('author-display').textContent = poem.author;
  document.getElementById('kami-text').textContent = poem.kami;
  document.getElementById('shimo-text').textContent = poem.shimo;
  document.getElementById('shimo-box').classList.remove('hidden');
  document.getElementById('phase-indicator').textContent = '読み上げ中…';
  document.getElementById('next-btn').textContent = '次へ';
  document.getElementById('next-btn').disabled = false;

  const remaining = queue.length - idx;
  document.getElementById('remaining').textContent = `残り ${remaining} / ${totalSelected}`;
  const pct = ((totalSelected - remaining) / totalSelected) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';

  playPoem(poem);
}

function nextPoem() {
  stopAll();
  currentIdx++;
  loadPoem(currentIdx);
}

// ===== DONE =====
function showDone() {
  document.getElementById('done-msg').textContent =
    `${totalSelected}首の読み上げが終わりました。`;
  showScreen('screen-done');
}

// ===== INIT =====
buildList();
loadSelection();
updateCount();
</script>
</body>
</html>
